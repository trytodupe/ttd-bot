[project]
name = "ttd-bot"
version = "1.2.11"
description = "ttd-bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "gunicorn>=23.0.0",
    "uvicorn[standard]>=0.35.0",
    "nonebot2[httpx,fastapi,aiohttp]>=2.4.3",
    "nb-cli>=1.4.2",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-orm[default]>=0.8.2",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-uninfo>=0.9.0",
    "nonebot-plugin-status @ git+https://github.com/trytodupe/plugin-status@b64c2a62b004e339ac4c975b63b7a6253c8abeab",
    "nonebot-plugin-chatrecorder>=0.7.0",
    "nonebot-plugin-wordcloud>=0.9.0",
    "nonebot-plugin-datastore>=1.3.1",
    "nonebot-plugin-add-friends @ git+https://github.com/trytodupe/nonebot-plugin-add-friends@46fe28f0676ec63b94fd7142bd596af1db3f5ccb",
    "nonebot-plugin-auto-sendlike>=0.0.12",
    "nonebot-plugin-authrespond>=1.8",
    "nonebot-plugin-deer-pipe @ git+https://github.com/trytodupe/nonebot-plugin-deer-pipe@46fd3c6aab020474388b62c49af6c4028cf5dd79",
    # "nonebot-plugin-learning-chat @ git+https://github.com/trytodupe/nonebot-plugin-learning-chat@6502044",
    "nonebot-plugin-tortoise-orm @ git+https://github.com/trytodupe/nonebot-plugin-tortoise-orm@135b31627a195811fd3030faeb9e5e5911fc2c79",
    "nonebot-plugin-auto-enter-group", # unused plugin
    "nonebot-plugin-analysis-bilibili>=2.8.1",
    "mcstatus>=11.1.0",
    "nonebot-plugin-clovers>=0.3.5",
    "nonebot-plugin-groupmate-waifu>=0.27",
    "clovers-setu-collection>=0.2.3.post1",
    # "nonebot-plugin-essence-message @ git+https://github.com/trytodupe/nonebot-plugin-essence-message@d120b28fa38e5eff5516ea204831314bf136c256",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "nonebot-plugin-steam-game-status @ git+https://github.com/trytodupe/nonebot_plugin_steam_game_status@4209a03ed793451c50b22b5e20c3d8885edb08f5",
    "nonebot-plugin-parser[ytdlp] @ git+https://github.com/trytodupe/nonebot-plugin-parser@1197ff319f5fbc9ea9f6056f36d3080461a1e133",
    "nonebot-plugin-moellmchats @ git+https://github.com/trytodupe/nonebot-plugin-moellmchats@ece441d6b083a8cd12d6cc18fec3b89fc2ad06ee",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "nonebot_plugin_orm",
    "nonebot_plugin_localstore",
    "nonebot_plugin_uninfo",
    "nonebot_plugin_status",
    "nonebot_plugin_chatrecorder",
    "nonebot_plugin_clovers",
    "nonebot_plugin_wordcloud",
    "nonebot_plugin_datastore",
    "nonebot_plugin_add_friends",
    "nonebot-plugin-auto-sendlike",
    "nonebot_plugin_authrespond",
    "nonebot_plugin_deer_pipe",
    # "nonebot_plugin_learning_chat",
    "nonebot_plugin_auto_enter_group",
    # "nonebot_plugin_analysis_bilibili",
    "nonebot_plugin_groupmate_waifu",
    # "nonebot_plugin_essence_message",
    "nonebot_plugin_steam_game_status",
    "nonebot_plugin_parser",
    "nonebot_plugin_moellmchats",
]
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo"]

[dependency-groups]
dev = [
    "nonebug>=0.4.3",
    "pre-commit>=4.0.0",
    "pytest-asyncio>=1.3.0",
]
